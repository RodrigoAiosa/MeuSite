name: Salvar imagens do LinkedIn

# Sempre que a aba "Em destaque Linkedin" (data/linkedin_posts.json) muda, baixa as
# imagens dos posts para assets/linkedin/ e troca os links que expiram por arquivos do site.
on:
  push:
    branches: [main]
    paths: [data/linkedin_posts.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commits-automaticos
  cancel-in-progress: false

jobs:
  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python salvar_imagens_linkedin.py
      - name: Commit das imagens
        run: |
          git add assets/linkedin data/linkedin_posts.json
          if git diff --cached --quiet; then echo "Nada para salvar."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Salva imagens dos posts do LinkedIn no site"
          git pull --rebase origin main
          git push origin HEAD:main
